# Reusable verification: the single definition of "is this code good".
# Called by ci.yml (on PRs) and by deploy-baremetal.yml (before it builds and
# pushes), so the checks live in one place instead of being duplicated.
name: Verify

on:
  workflow_call:

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

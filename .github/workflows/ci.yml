name: CI

# PR validation only. Pushes to main are covered by deploy-baremetal.yml, which
# calls the same verify workflow before building -- running both here too would
# duplicate every check on merge.
on:
  pull_request:
    branches: [main]

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  docker-build:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build the exact image the deploy uses, but never push. Catches
      # Dockerfile-only breakage (missing build deps, bad paths) on the PR
      # instead of after merge, when the deploy job builds for real.
      # The gha cache is shared with the deploy build, so this also warms it.
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy-baremetal/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
